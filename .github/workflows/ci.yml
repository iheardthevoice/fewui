name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Tema CSS'i, API sözlüğü, üretilen tipler ve doküman sayfaları kaynakla aynı mı?
      - run: pnpm --filter fewui run check:themes
      - run: pnpm --filter fewui run check:api
      - run: pnpm --filter fewui run check:meta
      - run: pnpm --filter fewui run check:types

      - run: pnpm --filter fewui run lint
      - run: pnpm --filter fewui run test

      # Kütüphane ve onu tüketen uygulamalar derleniyor mu?
      - run: pnpm --filter fewui run build
      - name: Committed dist is up to date
        run: git diff --exit-code -- packages/ui/dist ':!packages/ui/dist/*.map'
      - run: pnpm docs:build
      - run: pnpm www:build
      - run: pnpm kit-docs:build
